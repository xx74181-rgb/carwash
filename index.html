<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="洗車管理">
<title>洗車店管理系統</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#ffffff;--bg2:#f7f7f5;--bg3:#f0efea;
  --text:#1a1a1a;--text2:#666;--text3:#999;
  --border:#e5e5e0;--border2:#d0d0c8;
  --green:#1D9E75;--green-bg:#E1F5EE;--green-text:#085041;
  --blue-bg:#E6F1FB;--blue-text:#0C447C;
  --amber-bg:#FAEEDA;--amber-text:#633806;
  --red-bg:#FCEBEB;--red-text:#791F1F;
  --radius:10px;--radius-lg:14px;
  --touch:48px;
}
body{font-family:-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;color:var(--text);background:var(--bg3);min-height:100vh;-webkit-font-smoothing:antialiased}
.app-shell{max-width:560px;margin:0 auto;background:var(--bg);min-height:100vh;display:flex;flex-direction:column}
/* safe area for iPhone notch / iPad home bar */
.app-shell{padding-bottom:env(safe-area-inset-bottom)}
.topbar{display:flex;border-bottom:1.5px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:10;overflow-x:auto;padding-top:env(safe-area-inset-top)}
.topbar::-webkit-scrollbar{display:none}
.tab{padding:12px 10px;font-size:13px;cursor:pointer;border-bottom:2.5px solid transparent;color:var(--text2);white-space:nowrap;flex-shrink:0;transition:all 0.15s;user-select:none;min-height:var(--touch);display:flex;align-items:center}
.tab.active{color:var(--text);border-bottom-color:var(--green);font-weight:600}
.tab:active{background:var(--bg2)}
.screen{display:none;padding:18px;flex:1}
.screen.active{display:block}
.section-title{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:10px;margin-top:20px;text-transform:uppercase;letter-spacing:0.06em}
.section-title:first-child{margin-top:0}
.row{display:flex;gap:10px;margin-bottom:12px;align-items:flex-end}
.col{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
label{font-size:13px;color:var(--text2);font-weight:500}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--border2);border-radius:var(--radius);font-size:15px;background:var(--bg);color:var(--text);outline:none;font-family:inherit;transition:border-color 0.15s;min-height:var(--touch)}
input:focus,select:focus,textarea:focus{border-color:var(--green)}
textarea{resize:vertical;min-height:72px}
.btn{padding:12px 20px;border-radius:var(--radius);border:1.5px solid var(--border2);background:var(--bg);color:var(--text);font-size:14px;cursor:pointer;white-space:nowrap;transition:all 0.15s;font-family:inherit;min-height:var(--touch);display:inline-flex;align-items:center;justify-content:center}
.btn:active{transform:scale(0.97);background:var(--bg2)}
.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
.btn.primary:active{background:#0F6E56;border-color:#0F6E56}
.btn.block{width:100%}
.card{background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:10px}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.card-title{font-size:15px;font-weight:600;line-height:1.4}
.card-sub{font-size:13px;color:var(--text2);margin-top:3px}
.badge{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.badge-a{background:var(--green-bg);color:var(--green-text)}
.badge-b{background:var(--amber-bg);color:var(--amber-text)}
.badge-c{background:var(--red-bg);color:var(--red-text)}
.badge-pending{background:var(--amber-bg);color:var(--amber-text)}
.badge-doing{background:var(--blue-bg);color:var(--blue-text)}
.badge-done{background:var(--green-bg);color:var(--green-text)}
.divider{border:none;border-top:1px solid var(--border);margin:14px 0}
.kv{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:6px 0}
.kv .k{color:var(--text2)}
.kv .v{font-weight:500}
.msg{padding:12px 14px;border-radius:var(--radius);font-size:14px;margin-bottom:12px;line-height:1.5}
.msg-success{background:var(--green-bg);color:var(--green-text)}
.msg-error{background:var(--red-bg);color:var(--red-text)}
.msg-info{background:var(--blue-bg);color:var(--blue-text)}
.search-highlight{border:2px solid var(--green);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:12px;background:var(--green-bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.chip{padding:10px 16px;border-radius:99px;border:1.5px solid var(--border2);font-size:14px;cursor:pointer;background:var(--bg);color:var(--text);transition:all 0.15s;user-select:none;min-height:44px;display:inline-flex;align-items:center}
.chip.selected{background:var(--green);color:#fff;border-color:var(--green)}
.chip:active{transform:scale(0.96)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--bg2);border-radius:var(--radius);padding:12px 14px}
.stat-label{font-size:12px;color:var(--text2);margin-bottom:5px}
.stat-val{font-size:24px;font-weight:600}
.hist-item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.hist-item:last-child{border-bottom:none}
.hist-dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex-shrink:0;margin-top:5px}
.hist-info{flex:1;min-width:0}
.hist-date{font-size:12px;color:var(--text3);margin-top:3px}
.actions-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.empty{text-align:center;padding:48px 0;color:var(--text3);font-size:14px}
.status-sel{display:flex;gap:6px;margin-top:10px}
.status-sel button{flex:1;padding:10px 4px;border-radius:var(--radius);border:1.5px solid var(--border2);font-size:13px;cursor:pointer;background:var(--bg);color:var(--text2);transition:all 0.15s;font-family:inherit;min-height:44px}
.status-sel button:active{transform:scale(0.97)}
.status-sel button.active-pending{background:var(--amber-bg);color:var(--amber-text);border-color:#BA7517;font-weight:600}
.status-sel button.active-doing{background:var(--blue-bg);color:var(--blue-text);border-color:#185FA5;font-weight:600}
.status-sel button.active-done{background:var(--green-bg);color:var(--green-text);border-color:var(--green);font-weight:600}
.bar-wrap{margin:5px 0}
.bar-track{height:7px;background:var(--bg3);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:var(--green);border-radius:99px;transition:width 0.4s ease}
.cond-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:14px}
.cond-label{width:64px;color:var(--text2)}
.cond-count{width:28px;text-align:right;font-weight:600}
.hint-box{border:1.5px solid #BA7517;border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:12px;background:#FAEEDA}
.hint-title{font-size:13px;font-weight:600;color:#633806;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.hint-dot{width:7px;height:7px;border-radius:50%;background:#BA7517;flex-shrink:0}
.hint-item{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid #F5C97A}
.hint-item:last-child{border-bottom:none}
.hint-item-text{font-size:14px;color:#4A2800;line-height:1.4}
.hint-tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;background:#BA7517;color:#fff;white-space:nowrap;margin-left:4px;flex-shrink:0}
.hint-quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.hint-quick-btn{padding:8px 14px;border-radius:99px;border:1.5px solid #BA7517;font-size:13px;cursor:pointer;background:#fff;color:#633806;font-family:inherit;transition:all 0.15s;min-height:40px}
.hint-quick-btn:active{background:#BA7517;color:#fff}
.mcal-cell{border-right:0.5px solid var(--border);border-bottom:0.5px solid var(--border);min-height:80px;padding:5px;cursor:pointer;transition:background 0.1s;position:relative}
.mcal-cell:active{background:var(--bg2)}
.mcal-cell.today{background:#E1F5EE}
.mcal-cell.other-month .mcal-day-num{color:var(--text3)}
.mcal-cell.selected{outline:2.5px solid var(--green);outline-offset:-2px}
.mcal-day-num{font-size:14px;font-weight:600;margin-bottom:3px;line-height:1}
.mcal-cell.today .mcal-day-num{color:var(--green);font-weight:700}
.mcal-dot-row{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:3px}
.mcal-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.mcal-more{font-size:10px;color:var(--text3)}
.mcal-overflow-dot{width:8px;height:8px;border-radius:50%;background:#E24B4A;flex-shrink:0}
.sched-grid{display:grid;grid-template-columns:38px 1fr;gap:0}
.sched-hour-label{font-size:11px;color:var(--text3);text-align:right;padding-right:6px;line-height:1;padding-top:3px}
.sched-slot{border-left:1px solid var(--border);position:relative;height:48px;border-bottom:0.5px solid var(--border)}
.sched-now-line{position:absolute;left:0;right:0;height:2px;background:#E24B4A;z-index:5;pointer-events:none}
.sched-now-line::before{content:'';position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:#E24B4A}
.sched-block{position:absolute;left:2px;right:2px;border-radius:6px;padding:3px 6px;font-size:11px;line-height:1.3;overflow:hidden;cursor:pointer;z-index:2}
.sched-block:active{filter:brightness(0.9)}
.sched-block .sb-plate{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sched-block .sb-svc{opacity:0.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px}
.mcal-cell.cal-full{background:#FFF3E0;border-color:#EF9F27}
.mcal-cell.cal-overflow{background:#FCEBEB;border-color:#E24B4A}
.cal-full-badge{font-size:9px;font-weight:600;padding:2px 5px;border-radius:3px;background:#EF9F27;color:#fff;margin-top:2px;display:inline-block}
.ref-code{font-family:monospace;font-size:15px;font-weight:600;letter-spacing:2px;background:var(--bg2);padding:6px 12px;border-radius:var(--radius);border:1px dashed var(--border2)}
.staff-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.staff-bar-name{font-size:13px;color:var(--text2);width:64px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.staff-bar-val{font-size:13px;font-weight:600;flex-shrink:0;min-width:56px;text-align:right}
.sched-overflow-bar{position:absolute;left:2px;right:2px;border-radius:4px;z-index:4;border:1.5px solid #E24B4A;background:#FCEBEB;color:#791F1F;font-size:10px;padding:2px 5px;pointer-events:none}
.sched-legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2)}
.sched-legend-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
/* Today board */
.today-header{padding:16px 18px 12px;border-bottom:1px solid var(--border)}
.today-date{font-size:20px;font-weight:600}
.today-sub{font-size:13px;color:var(--text2);margin-top:3px}
.today-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.today-stat{text-align:center}
.today-stat-val{font-size:26px;font-weight:600;line-height:1}
.today-stat-label{font-size:12px;color:var(--text2);margin-top:4px}
.work-card{margin:0 18px 12px;border:1.5px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.work-card-top{padding:12px 14px;display:flex;align-items:flex-start;gap:12px}
.work-card-left{display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0;padding-top:2px}
.work-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
.work-time{font-size:11px;color:var(--text3);white-space:nowrap}
.work-card-body{flex:1;min-width:0}
.work-plate{font-size:17px;font-weight:600;line-height:1.3}
.work-meta{font-size:13px;color:var(--text2);margin-top:3px}
.work-svc{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;margin-top:6px}
.work-note{font-size:13px;color:var(--text2);padding:0 14px 12px;line-height:1.5;border-top:1px dashed var(--border)}
.work-actions{display:flex;border-top:1px solid var(--border)}
.work-action-btn{flex:1;padding:13px 4px;border:none;background:var(--bg);color:var(--text2);font-size:13px;cursor:pointer;font-family:inherit;transition:all 0.15s;border-right:1px solid var(--border);min-height:var(--touch)}
.work-action-btn:last-child{border-right:none}
.work-action-btn:active{background:var(--bg2);color:var(--text)}
.work-action-btn.active-doing{background:#E6F1FB;color:#0C447C;font-weight:600}
.work-action-btn.active-done{background:#E1F5EE;color:#085041;font-weight:600}
.work-action-btn.active-pending{background:#FAEEDA;color:#633806;font-weight:600}
.work-action-btn.notify-btn{color:#185FA5}
.work-action-btn.notify-btn.notified{color:var(--text3);text-decoration:line-through}
.today-section{padding:12px 18px 5px;font-size:12px;font-weight:600;color:var(--text2);letter-spacing:0.06em;text-transform:uppercase}
.today-empty{text-align:center;padding:48px 18px;color:var(--text3);font-size:14px}
.progress-ring{transform:rotate(-90deg)}
/* save indicator */
#save-indicator{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));right:16px;background:var(--green);color:#fff;font-size:12px;font-weight:600;padding:6px 14px;border-radius:99px;z-index:999;opacity:0;transition:opacity 0.3s;pointer-events:none}
</style>
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <div class="tab active" onclick="switchTab('today')">今日</div>
    <div class="tab" onclick="switchTab('schedule')">排程</div>
    <div class="tab" onclick="switchTab('search')">客戶</div>
    <div class="tab" onclick="switchTab('order')">開單</div>
    <div class="tab" onclick="switchTab('orders')">訂單</div>
    <div class="tab" onclick="switchTab('wallet')">儲值</div>
    <div class="tab" onclick="switchTab('dashboard')">儀表板</div>
    <div class="tab" onclick="switchTab('history')">車輛</div>
  </div>

  <!-- 今日工作板 -->
  <div id="screen-today" class="screen active">
    <div id="today-content"></div>
  </div>

  <!-- 客戶資料 -->
  <div id="screen-search" class="screen" style="padding:0">
    <!-- 搜尋列 -->
    <div style="padding:12px 18px 10px;border-bottom:1px solid var(--border);position:sticky;top:52px;background:var(--bg);z-index:5">
      <input id="search-q" placeholder="搜尋姓名、電話或車牌" oninput="onSearchQ()" style="width:100%" />
    </div>
    <!-- 顯示客戶按鈕 -->
    <div style="padding:14px 18px;border-bottom:1px solid var(--border)">
      <button class="btn block" onclick="toggleCustomerList()" id="customer-list-toggle">☰ 顯示所有客戶</button>
    </div>
    <!-- 會員清單（預設隱藏） -->
    <div id="customer-list" style="display:none"></div>
    <!-- 新增客戶（摺疊） -->
    <div style="padding:14px 18px;border-top:1px solid var(--border)">
      <button class="btn block" onclick="toggleNewCustomer()" id="new-customer-toggle">＋ 新增客戶</button>
      <div id="new-customer-form" style="display:none;margin-top:14px">
        <div class="row">
          <div class="col"><label>姓名（可空）</label><input id="new-name" placeholder="王小明" /></div>
          <div class="col"><label>電話 *</label><input id="new-phone" type="tel" placeholder="0912-345-678" /></div>
        </div>
        <div class="row">
          <div class="col"><label>車牌</label><input id="new-plate" placeholder="ABC1234" /></div>
          <div class="col"><label>車型</label>
            <select id="new-ctype">
              <option value="轎車">轎車</option>
              <option value="輕休旅/旅行車">輕休旅/旅行車</option>
              <option value="休旅車">休旅車</option>
              <option value="大型休旅車">大型休旅車</option>
              <option value="商務車/皮卡">商務車/皮卡</option>
              <option value="機車">機車</option>
              <option value="電動機車">電動機車</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div class="col"><label>車況等級</label>
            <select id="new-cond">
              <option value="A">A — 良好</option>
              <option value="B">B — 普通</option>
              <option value="C">C — 需處理</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div class="col"><label>推薦人車號（選填）</label><input id="new-ref-plate" placeholder="輸入推薦人的車牌號碼" /></div>
        </div>
        <button class="btn primary block" onclick="addCustomer()">建立客戶</button>
        <div id="new-msg" style="margin-top:8px"></div>
      </div>
    </div>
    <!-- 客戶詳細（彈出層） -->
    <div id="customer-detail-overlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:50" onclick="closeCustomerDetail()"></div>
    <div id="customer-detail-sheet" style="display:none;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:var(--bg);border-radius:20px 20px 0 0;z-index:51;max-height:85vh;overflow-y:auto;padding:20px 18px 32px">
      <div style="width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 16px"></div>
      <div id="customer-detail-body"></div>
    </div>
    <!-- 搜尋結果（舊邏輯保留，隱藏） -->
    <div id="search-result" style="display:none"></div>
  </div>

  <!-- 開單 -->
  <div id="screen-order" class="screen">
    <div class="section-title">選擇客戶</div>
    <div class="row" style="margin-bottom:4px">
      <div class="col"><input id="order-search" placeholder="輸入電話或姓名" oninput="fillOrderCustomer()" /></div>
    </div>
    <div id="order-search-list" style="margin-bottom:6px"></div>
    <div id="order-customer-info"></div>
    <div class="section-title">選擇車輛</div>
    <div id="order-cars" class="chips"><span style="color:var(--text3);font-size:12px">查詢客戶後顯示車輛</span></div>
    <div id="upsell-hint"></div>
    <div class="section-title">選擇服務項目（可複選，每項30分鐘）</div>
    <div class="chips" id="service-chips"></div>
    <div id="service-summary" style="font-size:12px;color:var(--text2);margin-bottom:4px;min-height:18px"></div>
    <div class="section-title">服務細節</div>
    <div class="row">
      <div class="col"><label>金額（元）</label><input id="order-price" type="number" placeholder="0" min="0" oninput="checkOrderBalance()" /></div>
      <div class="col"><label>預估時間（分鐘）</label><input id="order-time" type="number" placeholder="30" min="0" /></div>
    </div>
    <div class="section-title">預約時間（選填）</div>
    <div class="row">
      <div class="col"><label>日期</label><input id="order-appt-date" type="date" /></div>
      <div class="col"><label>時間</label><input id="order-appt-time" type="time" step="900" /></div>
    </div>
    <div class="section-title">負責美容師</div>
    <select id="order-staff" style="width:100%;margin-bottom:10px">
      <option value="">— 未指定 —</option>
      <option>美容師001</option>
      <option>美容師002</option>
      <option>美容師003</option>
      <option>美容師004</option>
      <option>美容師005</option>
    </select>
    <div class="col" style="margin-bottom:12px"><label>備註（選填）</label><textarea id="order-note" placeholder="車況特殊說明、客戶要求..."></textarea></div>

    <div class="section-title">車況照片 — 洗車前</div>
    <div id="order-photos-before" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px"></div>
    <label style="display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:1.5px dashed var(--border2);border-radius:var(--radius-lg);cursor:pointer;font-size:14px;color:var(--text2);margin-bottom:14px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M20.94 13A9 9 0 1 1 13 3.06"/><path d="M22 7V3h-4"/><path d="M18 3l4 4"/></svg>
      拍照 / 選取照片

function findByRefPlate(plate){
  if(!plate) return null;
  const p=plate.trim().toUpperCase().replace(/-/g,'');
  return db.customers.find(c=>c.cars.some(v=>v.plate.toUpperCase().replace(/-/g,'')===p));
}

function applyReferral(newPhone){
  const code=(document.getElementById(`ref-input-${newPhone}`)?.value||'').trim();
  const msgEl=document.getElementById(`ref-msg-${newPhone}`);
  if(!code){msgEl.innerHTML='<span style="color:#A32D2D">請輸入推薦人車號</span>';return;}
  const referrer=findByRefPlate(code);
  if(!referrer){msgEl.innerHTML='<span style="color:#A32D2D">找不到此車號的客戶</span>';return;}
  if(referrer.phone===newPhone){msgEl.innerHTML='<span style="color:#A32D2D">不能推薦自己</span>';return;}
  const refs=db.referrals||{};
  if(refs[newPhone]){msgEl.innerHTML='<span style="color:#A32D2D">此客戶已使用過推薦</span>';return;}
  refs[newPhone]={referrer:referrer.phone,rewarded:false,newMember:newPhone};db.referrals=refs;
  // 新會員獲得 $500 優惠金
  const wNew=getWallet(newPhone);
  wNew.bonus=(wNew.bonus||0)+500;
  wNew.txns.push({type:'topup',amount:500,note:`推薦優惠金（由 ${referrer.name||code} 推薦）`,date:nowStr(),balance:totalBalance(wNew)});
  msgEl.innerHTML=`<span style="color:#085041">✓ 推薦成立！已獲得 $500 優惠金，推薦人完成首次服務後獲得 $300 優惠金</span>`;
  scheduleSave();
  renderCustomerList();
}

function checkReferralReward(phone){
  const refs=db.referrals||{}; const ref=refs[phone];
  if(ref&&!ref.rewarded){
    ref.rewarded=true;
    const wRef=getWallet(ref.referrer);
    wRef.bonus=(wRef.bonus||0)+300;
    wRef.txns.push({type:'topup',amount:300,note:`推薦獎勵優惠金（${findCustomer(phone)?.name||phone} 首次消費）`,date:nowStr(),balance:totalBalance(wRef)});
  }
}

function addCustomer(){
  const name=document.getElementById('new-name').value.trim();
  const phone=document.getElementById('new-phone').value.trim();
  const plate=document.getElementById('new-plate').value.trim().toUpperCase().replace(/-/g,'');
  const type=document.getElementById('new-ctype').value;
  const cond=document.getElementById('new-cond').value;
  const refPlate=(document.getElementById('new-ref-plate')?.value||'').trim().toUpperCase().replace(/-/g,'');
  const msgEl=document.getElementById('new-msg');
  if(!phone){msgEl.innerHTML='<div class="msg msg-error">電話號碼為必填欄位</div>';return;}
  if(findCustomer(phone)){msgEl.innerHTML='<div class="msg msg-error">此電話號碼已存在</div>';return;}
  if(plate){
    const plateExists=db.customers.some(c=>c.cars.some(v=>v.plate===plate));
    if(plateExists){msgEl.innerHTML='<div class="msg msg-error">此車牌已存在，請確認是否重複登入</div>';return;}
  }
  const cars=plate?[{plate,type,cond}]:[];
  db.customers.push({phone,name,cars});

  let refMsg='';
  // 處理推薦車號
  if(refPlate){
    const refs=db.referrals||{};
    if(refs[phone]){
      refMsg=' — 此客戶已使用過推薦';
    } else {
      const referrer=findByRefPlate(refPlate);
      if(!referrer){
        refMsg=' — 找不到推薦車號，推薦未套用';
      } else if(referrer.phone===phone){
        refMsg=' — 不能推薦自己';
      } else {
        refs[phone]={referrer:referrer.phone,rewarded:false,newMember:phone};
        db.referrals=refs;
        const wNew=getWallet(phone);
        wNew.bonus=(wNew.bonus||0)+500;
        wNew.txns.push({type:'topup',amount:500,note:`推薦優惠金（由 ${referrer.name||refPlate} 推薦）`,date:nowStr(),balance:totalBalance(wNew)});
        refMsg=` — 推薦成立，已獲 $500 優惠金`;
      }
    }
  }

  msgEl.innerHTML=`<div class="msg msg-success">客戶已建立${plate?' — '+plate:''}${refMsg}</div>`;
  ['new-name','new-phone','new-plate','new-ref-plate'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  renderCustomerList();
}

  checkOrderBalance();

  const summaryEl=document.getElementById('service-summary');

const HIGH_VALUE_SERVICES=['鍍膜','美容','打蠟','引擎清洗'];
const DAYS_THRESHOLD=60;
function daysSince(dateStr){ const d=new Date(dateStr.replace(' ','T')); return Math.floor((Date.now()-d.getTime())/86400000); }
function showUpsellHint(plate){
  const hintEl=document.getElementById('upsell-hint'); const c=findCustomer(orderState.phone); if(!c){hintEl.innerHTML='';return;}
  const car=c.cars.find(v=>v.plate===plate); if(!car){hintEl.innerHTML='';return;}
  const carOrders=db.orders.filter(o=>o.plate===plate&&o.status==='done'); carOrders.sort((a,b)=>new Date(b.created)-new Date(a.created));
  const lastOrder=carOrders[0]; const daysSinceLast=lastOrder?daysSince(lastOrder.created):999;
  const doneServices=new Set(carOrders.map(o=>o.service)); const neverHighValue=HIGH_VALUE_SERVICES.filter(s=>!doneServices.has(s));
  const hints=[];
  if(car.cond==='C')hints.push({tag:'車況 C',text:'此車上次評估為 C 等級，建議推薦美容或深度清潔，同時更新車況評估。',suggest:['美容','內裝清潔']});
  if(daysSinceLast>DAYS_THRESHOLD)hints.push({tag:lastOrder?`距上次服務 ${daysSinceLast} 天`:'首次進場',text:lastOrder?`超過 ${daysSinceLast} 天未回訪，是追加定期保養的好時機。`:'此車輛為首次進場，可趁機推薦完整美容或鍍膜服務。',suggest:['精緻洗','打蠟']});
  if(neverHighValue.length>0&&carOrders.length>=1)hints.push({tag:'從未做過',text:`此車從未做過：${neverHighValue.slice(0,3).join('、')}，可主動詢問客戶需求。`,suggest:neverHighValue.slice(0,2)});
  if(!hints.length){hintEl.innerHTML='';return;}
  const allSuggest=[...new Set(hints.flatMap(h=>h.suggest))].slice(0,4);
  hintEl.innerHTML=`<div class="hint-box"><div class="hint-title"><div class="hint-dot"></div>銷售機會提醒 — ${c.name||car.plate}</div>${hints.map(h=>`<div class="hint-item"><span class="hint-tag">${h.tag}</span><span class="hint-item-text">${h.text}</span></div>`).join('')}<div class="hint-quick">${allSuggest.map(s=>`<button class="hint-quick-btn" onclick="quickSelectService('${s}')">${s} ↓</button>`).join('')}</div></div>`;
}

// 暫存洗車前照片（base64）
let pendingBeforePhotos = [];

function addBeforePhotos(input){
  const files = Array.from(input.files);
  if(!files.length) return;
  const preview = document.getElementById('order-photos-before');
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = ev=>{
      const b64 = ev.target.result;
      pendingBeforePhotos.push(b64);
      const img = document.createElement('div');
      img.style.cssText='position:relative;width:80px;height:80px;border-radius:8px;overflow:hidden;flex-shrink:0';
      const idx = pendingBeforePhotos.length - 1;
      img.innerHTML=`<img src="${b64}" style="width:100%;height:100%;object-fit:cover">
        <button onclick="removeBeforePhoto(${idx},this.parentNode)" style="position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,0.5);color:#fff;border:none;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1">✕</button>`;
      preview.appendChild(img);
    };
    reader.readAsDataURL(file);
  });
  input.value=''; // reset so same file can be re-added
}

function removeBeforePhoto(idx, el){
  pendingBeforePhotos[idx] = null;
  el.remove();
}

function photosHtml(photos, label){

function addAfterPhotos(orderId, input){
  const files = Array.from(input.files);
  if(!files.length) return;
  const o = db.orders.find(o=>o.id===orderId);
  if(!o) return;
  if(!o.photosAfter) o.photosAfter=[];
  let loaded=0;
  files.forEach(file=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      o.photosAfter.push(ev.target.result);
      loaded++;
      if(loaded===files.length){ scheduleSave(); renderOrders(); }

    reader.readAsDataURL(file);
  });
  input.value='';
}

const notified=new Set();
function renderToday(){
  const today=todayStr(); const wdays=['日','一','二','三','四','五','六']; const d=new Date(); const wd=wdays[d.getDay()]; const nowM=d.getHours()*60+d.getMinutes();
  const todayOrders=db.orders.filter(o=>o.created.startsWith(today)); const todaySched=(db.schedule||[]).filter(e=>e.date===today);
  const pending=todayOrders.filter(o=>o.status==='pending').length; const doing=todayOrders.filter(o=>o.status==='doing').length; const done=todayOrders.filter(o=>o.status==='done').length; const total=todayOrders.length;
  const revenue=todayOrders.filter(o=>o.status==='done').reduce((s,o)=>s+o.price,0);
  const r=18,circ=2*Math.PI*r,pct=total?done/total:0,dash=Math.round(pct*circ);
  let html=`<div class="today-header"><div style="display:flex;align-items:center;justify-content:space-between"><div><div class="today-date">${today.slice(5).replace('-','/')} 週${wd}</div><div class="today-sub">${doing>0?`目前進行中 ${doing} 台`:'目前無進行中服務'}</div></div><svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="${r}" fill="none" stroke="var(--border)" stroke-width="4"/><circle cx="22" cy="22" r="${r}" fill="none" stroke="#1D9E75" stroke-width="4" stroke-dasharray="${dash} ${circ}" stroke-linecap="round" transform="rotate(-90 22 22)"/><text x="22" y="26" text-anchor="middle" font-size="11" font-weight="500" fill="var(--text)">${Math.round(pct*100)}%</text></svg></div></div>
  <div class="today-stats"><div class="today-stat"><div class="today-stat-val">${pending}</div><div class="today-stat-label">待處理</div></div><div class="today-stat"><div class="today-stat-val" style="color:#185FA5">${doing}</div><div class="today-stat-label">進行中</div></div><div class="today-stat"><div class="today-stat-val" style="color:#1D9E75">${done}</div><div class="today-stat-label">完成</div></div></div>`;
  const mergedKeys=new Set(),workItems=[];
  const activeSched=todaySched.filter(e=>{const es=toMinutes(e.start);return es+e.dur>nowM;}).sort((a,b)=>toMinutes(a.start)-toMinutes(b.start));
  activeSched.forEach(e=>{const matchOrder=todayOrders.find(o=>o.plate===e.plate&&o.status!=='done');workItems.push({type:'sched',sched:e,order:matchOrder||null});if(matchOrder)mergedKeys.add(matchOrder.id);});
  todayOrders.filter(o=>!mergedKeys.has(o.id)).forEach(o=>workItems.push({type:'order',order:o,sched:null}));
  workItems.sort((a,b)=>{const so={doing:0,pending:1,done:2};const sa=a.order?.status||'pending',sb=b.order?.status||'pending';if(so[sa]!==so[sb])return so[sa]-so[sb];const ta=a.sched?toMinutes(a.sched.start):999,tb=b.sched?toMinutes(b.sched.start):999;return ta-tb;});
  const inProgress=workItems.filter(w=>w.order?.status==='doing');
  const waiting=workItems.filter(w=>w.order?.status==='pending'||(!w.order&&w.sched));
  const finished=workItems.filter(w=>w.order?.status==='done');
  function buildCard(w,idx){
    const o=w.order,s=w.sched; const plate=o?.plate||s?.plate||'—'; const service=o?.service||s?.service||'—';
    const timeStr=s?s.start:(o?.created?.slice(11,16)||''); const dur=s?.dur||o?.time||0;
    const customer=findCustomer(o?.phone||s?.phone||''); const name=customer?(customer.name||'未填姓名'):'';
    const note=o?.note||''; const status=o?.status||'pending'; const isNotified=notified.has(o?.id);
    const w2=o?getWallet(o.phone):null; const canComplete=!o||o.price===0||o.payment==='cash'||(w2&&w2.balance>=o.price);
    const sc={pending:{bg:'#FAEEDA',c:'#633806'},doing:{bg:'#E6F1FB',c:'#0C447C'},done:{bg:'#E1F5EE',c:'#085041'}}[status];
    const numBg={pending:'#FAEEDA',doing:'#E6F1FB',done:'#E1F5EE'}[status]; const numC={pending:'#633806',doing:'#0C447C',done:'#085041'}[status];
    const isLate=s&&toMinutes(s.start)<nowM&&status==='pending';
    return`<div class="work-card" style="${isLate?'border-color:#E24B4A':''}"><div class="work-card-top"><div class="work-card-left"><div class="work-num" style="background:${numBg};color:${numC}">${idx+1}</div>${timeStr?`<div class="work-time">${timeStr}</div>`:''} ${dur?`<div class="work-time">${dur}min</div>`:''}</div><div class="work-card-body"><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"><div class="work-plate">${plate}</div>${isLate?'<span style="font-size:10px;color:#A32D2D;font-weight:500">遲到</span>':''}</div><div class="work-meta">${name}${name&&customer?.phone?' · ':''}</div><div style="margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span class="work-svc" style="background:${sc.bg};color:${sc.c}">${service}</span>${o&&!canComplete?'<span style="font-size:10px;color:#A32D2D">儲值不足</span>':''}</div></div></div>${note?`<div class="work-note">${note}</div>`:''}<div class="work-actions">${o?`<button class="work-action-btn ${status==='pending'?'active-pending':''}" onclick="todaySetStatus('${o.id}','pending')">待處理</button><button class="work-action-btn ${status==='doing'?'active-doing':''}" onclick="todaySetStatus('${o.id}','doing')">進行中</button><button class="work-action-btn ${status==='done'?'active-done':''}" onclick="todaySetStatus('${o.id}','done')" ${!canComplete&&status!=='done'?'style="opacity:0.4;cursor:not-allowed"':''}>完成</button><button class="work-action-btn notify-btn ${isNotified?'notified':''}" onclick="todayNotify('${o.id}')">${isNotified?'已通知':'通知'}</button>`:o===null?`<button class="work-action-btn" onclick="goOrder('${s?.phone||''}')">開單 →</button>`:''}</div></div>`;
  }
  if(!workItems.length){html+=`<div class="today-empty">今日尚無排程或訂單<br><br><button class="btn primary" onclick="switchTab('order')">立即開單</button></div>`;}
  else{
    if(inProgress.length){html+=`<div class="today-section">進行中</div>`;html+=inProgress.map((w,i)=>buildCard(w,i)).join('');}
    if(waiting.length){html+=`<div class="today-section">待處理</div>`;html+=waiting.map((w,i)=>buildCard(w,i)).join('');}
    if(finished.length){html+=`<div class="today-section">已完成 — 今日營收 $${revenue.toLocaleString()}</div>`;html+=finished.map((w,i)=>buildCard(w,i)).join('');}
  }
  document.getElementById('today-content').innerHTML=html;
}

let paySheetOrderId=null;

function openPaySheet(id){
  const o=db.orders.find(o=>o.id===id);if(!o)return;
  paySheetOrderId=id;
  const c=findCustomer(o.phone);
  const w=getWallet(o.phone);
  const bal=totalBalance(w);
  const bonus=w.bonus||0;
  document.getElementById('pay-sheet-title').textContent=`${o.plate} — ${o.service}`;
  document.getElementById('pay-sheet-info').textContent=`${c?(c.name||'未填姓名'):o.phone} · 金額 $${o.price.toLocaleString()}`;
  // wallet info
  const walletShort=bal<o.price?` （差 $${(o.price-bal).toLocaleString()}，可現金補）`:'';
  document.getElementById('pay-wallet-info').textContent=`儲值金 $${w.balance.toLocaleString()} + 優惠金 $${bonus.toLocaleString()} = $${bal.toLocaleString()}${walletShort}`;
  // bonus info
  const bonusShort=bonus<o.price?` （差 $${(o.price-bonus).toLocaleString()}，可現金補）`:'';
  document.getElementById('pay-bonus-info').textContent=`優惠金餘額 $${bonus.toLocaleString()}${bonusShort}`;
  document.getElementById('pay-overlay').style.display='block';
  document.getElementById('pay-sheet').style.display='block';
}

function closePaySheet(){
  document.getElementById('pay-overlay').style.display='none';
  document.getElementById('pay-sheet').style.display='none';
  paySheetOrderId=null;
}

function confirmPay(mode){
  const id=paySheetOrderId;
  closePaySheet();
  const o=db.orders.find(o=>o.id===id);if(!o)return;
  o.payment=mode;
  // now complete the order
  _completeOrder(o);
}

function _completeOrder(o){
  const isCash=o.payment==='cash'||!o.payment;
  const isBonus=o.payment==='bonus';
  if(o.price>0){
    if(isBonus){
      const w=getWallet(o.phone);const bonus=w.bonus||0;
      if(bonus<o.price){
        const short=o.price-bonus;
        const choice=confirm(`優惠金不足\n差額 $${short.toLocaleString()}\n\n確定 → 扣光優惠金，現場收現金 $${short.toLocaleString()}\n取消 → 不完成`);
        if(!choice)return;
        if(bonus>0){w.bonus=0;w.txns.push({type:'deduct',amount:bonus,note:`優惠金 ${o.service} ${o.plate}`,date:nowStr(),balance:totalBalance(w)});}
        o.cashSupplement=short;
      } else {
        w.bonus-=o.price;
        w.txns.push({type:'deduct',amount:o.price,note:`優惠金 ${o.service} ${o.plate}`,date:nowStr(),balance:totalBalance(w)});
      }
      o.deducted=true;
    } else if(!isCash){
      const w=getWallet(o.phone);const bal=totalBalance(w);
      if(bal<o.price){
        const short=o.price-bal;
        const choice=confirm(`儲值不足\n差額 $${short.toLocaleString()}\n\n確定 → 扣光儲值，現場收現金 $${short.toLocaleString()}\n取消 → 不完成`);
        if(!choice)return;
        deductWallet(o.phone,bal,`${o.service} ${o.plate}（儲值部分）`);
        o.cashSupplement=short;
      } else {
        deductWallet(o.phone,o.price,`${o.service} ${o.plate}`);
      }
      o.deducted=true;
    }
  }
  o.status='done';
  checkReferralReward(o.phone);
  scheduleSave();
  renderToday();
  renderOrders();
}

function todaySetStatus(id,status){
  const o=db.orders.find(o=>o.id===id);if(!o)return;

function renderOrders(){
  const filterStatus=document.getElementById('filter-status').value; const filterStaff=document.getElementById('filter-staff').value;
  let list=db.orders.slice(); if(filterStatus)list=list.filter(o=>o.status===filterStatus); if(filterStaff)list=list.filter(o=>o.staff===filterStaff);
  const el=document.getElementById('orders-list');
  if(!list.length){el.innerHTML='<div class="empty">目前沒有符合的訂單</div>';return;}
  el.innerHTML=[...list].reverse().map(o=>{
    const c=findCustomer(o.phone);
    const isCash=o.payment==='cash'; const isBonus=o.payment==='bonus'; const isWallet=o.payment==='wallet'; const w=getWallet(o.phone); const bal=totalBalance(w); const canComplete=true; const short=0;

function getWallet(phone){
  if(!db.wallets[phone])db.wallets[phone]={balance:0,bonus:0,txns:[]};
  if(db.wallets[phone].bonus===undefined)db.wallets[phone].bonus=0; // migrate old data
  return db.wallets[phone];
}
function nowStr(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}
function totalBalance(w){return w.balance+(w.bonus||0);}
function walletBadgeHtml(w){
  const total=totalBalance(w);
  if(total>1000)return`<span class="badge badge-done">$${total.toLocaleString()}</span>`;
  if(total>0)return`<span class="badge badge-b">$${total.toLocaleString()}</span>`;
  return`<span class="badge badge-c">$0</span>`;
}

function loadWallet(){

function renderTxns(phone){

function setTopup(amount){document.getElementById('topup-amount').value=amount;}
function doTopup(){
  const phone=walletCurrentPhone; const amount=parseInt(document.getElementById('topup-amount').value); const note=document.getElementById('topup-note').value.trim()||'現金儲值'; const msgEl=document.getElementById('topup-msg');
  if(!phone||!findCustomer(phone)){msgEl.innerHTML='<div class="msg msg-error">找不到客戶</div>';return;}
  if(!amount||amount<=0){msgEl.innerHTML='<div class="msg msg-error">請輸入有效金額</div>';return;}
  const w=getWallet(phone);
  w.balance+=amount;
  w.txns.push({type:'topup',amount,note,date:nowStr(),balance:totalBalance(w)});
  document.getElementById('topup-amount').value='';document.getElementById('topup-note').value='';
  msgEl.innerHTML=`<div class="msg msg-success">已儲值 $${amount.toLocaleString()}，儲值金餘額 $${w.balance.toLocaleString()}</div>`;
  loadWallet();
}

function deductWallet(phone,amount,note){
  const w=getWallet(phone);
  let remain=amount;
  // 優惠金先扣
  if((w.bonus||0)>0){
    const bonusUse=Math.min(w.bonus,remain);
    w.bonus-=bonusUse;
    remain-=bonusUse;
    if(bonusUse>0) w.txns.push({type:'deduct',amount:bonusUse,note:`優惠金 ${note}`,date:nowStr(),balance:totalBalance(w)});
  }
  // 再扣儲值金
  if(remain>0){
    w.balance-=remain;
    w.txns.push({type:'deduct',amount:remain,note,date:nowStr(),balance:totalBalance(w)});
  }
  return totalBalance(w);
}

function deleteOrder(id){
  const o=db.orders.find(o=>o.id===id);if(!o)return;
  const c=findCustomer(o.phone);
  if(!confirm(`刪除訂單？\n${o.id} — ${o.service}\n${c?(c.name||'未填姓名'):o.phone} / ${o.plate}\n$${o.price.toLocaleString()}\n\n此操作無法復原`))return;
  // 如果已扣款，退回儲值
  if(o.deducted&&o.payment==='wallet'&&o.price>0){
    const w=getWallet(o.phone);
    w.balance+=o.price;
    w.txns.push({type:'topup',amount:o.price,note:`退款（刪除訂單 ${o.id}）`,date:nowStr(),balance:totalBalance(w)});
  }
  db.orders=db.orders.filter(ord=>ord.id!==id);
  scheduleSave();
  renderOrders();
}

let cashFlowUnlocked=false;
function renderDash(){
  const total=db.orders.length; const done=db.orders.filter(o=>o.status==='done').length; const doing=db.orders.filter(o=>o.status==='doing').length; const pending=db.orders.filter(o=>o.status==='pending').length;

  const svcs={};db.orders.forEach(o=>{svcs[o.service]=(svcs[o.service]||0)+1;});
  const topSvcs=Object.entries(svcs).sort((a,b)=>b[1]-a[1]); const maxSvc=topSvcs[0]?topSvcs[0][1]:1;
  const conds={A:0,B:0,C:0};db.customers.forEach(c=>c.cars.forEach(v=>{if(conds[v.cond]!==undefined)conds[v.cond]++;})); const maxCond=Math.max(conds.A,conds.B,conds.C,1);
  const lockHtml=cashFlowUnlocked?renderCashFlow():`<div style="border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 16px;text-align:center;margin-top:4px"><div style="font-size:13px;color:var(--text2);margin-bottom:12px">金流報表需要授權才能查看</div><div style="display:flex;gap:8px;max-width:240px;margin:0 auto"><input id="cf-pwd" type="password" placeholder="輸入密碼" maxlength="10" style="flex:1;text-align:center;letter-spacing:4px;font-size:16px" onkeydown="if(event.key==='Enter')unlockCashFlow()" /><button class="btn primary" onclick="unlockCashFlow()">解鎖</button></div><div id="cf-pwd-msg" style="margin-top:8px;font-size:12px;color:#A32D2D;min-height:18px"></div></div>`;

iv style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px"><div class="section-title" style="margin:0">每月金流</div>${cashFlowUnlocked?`<button class="btn" style="font-size:11px;padding:4px 8px" onclick="lockCashFlow()">鎖定</button>`:''}</div>${lockHtml}`;

function unlockCashFlow(){const val=document.getElementById('cf-pwd').value;if(val==='0000'){cashFlowUnlocked=true;renderDash();}else{document.getElementById('cf-pwd-msg').textContent='密碼錯誤，請再試一次';document.getElementById('cf-pwd').value='';document.getElementById('cf-pwd').focus();}}
function lockCashFlow(){cashFlowUnlocked=false;renderDash();}
function renderCashFlow(){
  const doneOrders=db.orders.filter(o=>o.status==='done');
  const monthMap={};
  doneOrders.forEach(o=>{
    const ym=o.created.slice(0,7);
    if(!monthMap[ym])monthMap[ym]={revenue:0,cash:0,wallet:0,bonus:0,count:0,svcs:{}};
    monthMap[ym].revenue+=o.price;
    monthMap[ym].count++;
    monthMap[ym].svcs[o.service]=(monthMap[ym].svcs[o.service]||0)+1;
    if(o.payment==='cash'||!o.payment) monthMap[ym].cash+=o.price;
    else {
      // 估算優惠金使用比例（從wallet txns）
      monthMap[ym].wallet+=o.price;
    }
  });
  const months=Object.keys(monthMap).sort().reverse();
  if(!months.length)return'<div class="empty">尚無已完成訂單</div>';

  const totalRev=months.reduce((s,m)=>s+monthMap[m].revenue,0);
  const thisMonth=months[0],lastMonth=months[1];
  const growthHtml=lastMonth?(()=>{const diff=monthMap[thisMonth].revenue-monthMap[lastMonth].revenue;const pct=Math.round(diff/monthMap[lastMonth].revenue*100);const up=diff>=0;return`<div style="font-size:12px;color:${up?'#085041':'#A32D2D'};margin-top:2px">${up?'▲':'▼'} ${Math.abs(pct)}% 較上月</div>`;})():'';
  const avgRev=Math.round(totalRev/months.length);
  const avgCount=(months.reduce((s,m)=>s+monthMap[m].count,0)/months.length).toFixed(1);
  const allSvcs={};doneOrders.forEach(o=>allSvcs[o.service]=(allSvcs[o.service]||0)+o.price);
  const topSvcByRev=Object.entries(allSvcs).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const topCust={};doneOrders.forEach(o=>topCust[o.phone]=(topCust[o.phone]||0)+o.price);
  const topCustList=Object.entries(topCust).sort((a,b)=>b[1]-a[1]).slice(0,3);

  // 計算全站優惠金發放與使用
  const totalBonusGiven=Object.values(db.wallets||{}).reduce((s,w)=>{
    return s+(w.txns||[]).filter(t=>t.type==='topup'&&t.note&&t.note.includes('優惠金')).reduce((ss,t)=>ss+t.amount,0);
  },0);
  const totalBonusUsed=Object.values(db.wallets||{}).reduce((s,w)=>{
    return s+(w.txns||[]).filter(t=>t.type==='deduct'&&t.note&&t.note.includes('優惠金')).reduce((ss,t)=>ss+t.amount,0);
  },0);
  const totalCashRev=doneOrders.filter(o=>o.payment==='cash'||!o.payment).reduce((s,o)=>s+o.price,0);
  const totalWalletRev=doneOrders.filter(o=>o.payment==='wallet').reduce((s,o)=>s+o.price,0);

  return`
  <div class="stat-grid" style="margin-bottom:8px">
    <div class="stat"><div class="stat-label">本月營收</div><div class="stat-val" style="font-size:18px">$${(monthMap[thisMonth]?.revenue||0).toLocaleString()}</div>${growthHtml}</div>
    <div class="stat"><div class="stat-label">月均營收</div><div class="stat-val" style="font-size:18px">$${avgRev.toLocaleString()}</div></div>
    <div class="stat"><div class="stat-label">月均單數</div><div class="stat-val" style="font-size:18px">${avgCount}</div></div>
  </div>

  <div class="divider"></div>
  <div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:8px">金流來源拆分</div>
  <div class="kv" style="font-size:13px"><span class="k">現金收入</span><span class="v" style="color:#085041">$${totalCashRev.toLocaleString()} <span style="font-size:11px;color:var(--text3)">(${totalRev?Math.round(totalCashRev/totalRev*100):0}%)</span></span></div>
  <div class="kv" style="font-size:13px"><span class="k">儲值扣款收入</span><span class="v" style="color:#0C447C">$${totalWalletRev.toLocaleString()} <span style="font-size:11px;color:var(--text3)">(${totalRev?Math.round(totalWalletRev/totalRev*100):0}%)</span></span></div>

const SLOT_COLORS=['#5DCAA5','#378ADD','#7F77DD','#EF9F27','#D4537E','#D85A30'];
const SLOT_TEXT  =['#04342C','#042C53','#26215C','#412402','#4B1528','#4A1B0C'];
function toMinutes(t){const[h,m]=t.split(':').map(Number);return h*60+m;}
function fromMinutes(m){return`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;}
function todayStr(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function dateStr(y,m,d){return`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}

let schedMonth={y:2026,m:5};
let schedViewDate='2026-05-04';
let schedView='month';

const colorCache={};
function getColor(phone){if(!colorCache[phone]){const idx=Object.keys(colorCache).length%SLOT_COLORS.length;colorCache[phone]={bg:SLOT_COLORS[idx],text:SLOT_TEXT[idx]};}return colorCache[phone];}
function countOverlapAt(entries,startM,endM){return entries.filter(e=>{const es=toMinutes(e.start);return es<endM&&es+e.dur>startM;}).length;}

function renderSchedule(){if(schedView==='month')renderMonth();else renderDay();}

function renderMonth(){
  schedView='month';
  document.getElementById('sched-month-view').style.display='block';
  document.getElementById('sched-day-view').style.display='none';
  const{y,m}=schedMonth;
  document.getElementById('month-label').textContent=`${y} 年 ${m} 月`;
  const first=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate(),prevDays=new Date(y,m-1,0).getDate(),today=todayStr();
  let html='<div style="display:grid;grid-template-columns:repeat(7,1fr)">',cells=0;
  for(let i=0;i<first;i++){const dd=prevDays-first+1+i;html+=monthCell(dateStr(m===1?y-1:y,m===1?12:m-1,dd),dd,true,today);cells++;}
  for(let d=1;d<=days;d++){html+=monthCell(dateStr(y,m,d),d,false,today);cells++;}
  const remain=cells%7===0?0:7-cells%7;
  for(let i=1;i<=remain;i++)html+=monthCell(dateStr(m===12?y+1:y,m===12?1:m+1,i),i,true,today);
  html+='</div>';
  document.getElementById('month-grid').innerHTML=html;
}

function monthCell(ds,dayNum,otherMonth,today){
  const entries=(db.schedule||[]).filter(e=>e.date===ds);
  const isToday=ds===today,isSelected=ds===schedViewDate;
  let fullyBooked=false,hasOverflow=false;
  if(entries.length>=2){const buckets={};entries.forEach(e=>{const es=toMinutes(e.start);for(let m=es;m<es+e.dur;m++)buckets[m]=(buckets[m]||0)+1;});const counts=Object.values(buckets);if(counts.some(c=>c>=2))fullyBooked=true;if(counts.some(c=>c>2))hasOverflow=true;}
  let cls='mcal-cell';if(otherMonth)cls+=' other-month';if(isToday)cls+=' today';if(isSelected)cls+=' selected';if(hasOverflow)cls+=' cal-overflow';else if(fullyBooked)cls+=' cal-full';
  const phonesSeen={};entries.forEach(e=>phonesSeen[e.phone]=getColor(e.phone));
  const dots=Object.entries(phonesSeen).slice(0,3).map(([p,c])=>`<div class="mcal-dot" style="background:${c.bg}"></div>`).join('');
  const extra=entries.length>3?`<div class="mcal-more">+${entries.length-3}</div>`:'';
  const fullBadge=hasOverflow?`<div class="cal-full-badge" style="background:#E24B4A">⚠ 超額</div>`:fullyBooked?`<div class="cal-full-badge">🔒 額滿</div>`:'';
  return`<div class="${cls}" onclick="openDay('${ds}')"><div class="mcal-day-num">${dayNum}</div><div class="mcal-dot-row">${dots}${extra}</div>${fullBadge}</div>`;
}

function monthNav(dir){schedMonth.m+=dir;if(schedMonth.m>12){schedMonth.m=1;schedMonth.y++;}if(schedMonth.m<1){schedMonth.m=12;schedMonth.y--;}renderMonth();}

function openDay(ds){schedViewDate=ds;schedView='day';document.getElementById('sched-month-view').style.display='none';document.getElementById('sched-day-view').style.display='block';document.getElementById('sched-start').value='09:00';document.getElementById('sched-overlap-warn').innerHTML='';document.getElementById('sched-add-msg').innerHTML='';renderDay();}
function backToMonth(){schedView='month';document.getElementById('sched-month-view').style.display='block';document.getElementById('sched-day-view').style.display='none';renderMonth();}
function dayNav(dir){const d=new Date(schedViewDate+'T12:00:00');d.setDate(d.getDate()+dir);schedViewDate=d.toISOString().slice(0,10);const[y,m]=schedViewDate.split('-').map(Number);schedMonth={y,m};renderDay();}

function renderDay(){
  const wdays=['日','一','二','三','四','五','六'];
  const d=new Date(schedViewDate+'T12:00:00');
  document.getElementById('day-label').textContent=`${schedViewDate}（週${wdays[d.getDay()]}）`;
  const entries=(db.schedule||[]).filter(e=>e.date===schedViewDate);
  const HOUR_START=8,HOUR_END=20,PX=48/60;
  const startMins=HOUR_START*60,totalPx=(HOUR_END-HOUR_START)*48;
  const SNAP=15;
  const colorMap={};entries.forEach(e=>colorMap[e.phone]=getColor(e.phone));
  document.getElementById('day-legend').innerHTML=Object.entries(colorMap).map(([p,c])=>{
    const cu=findCustomer(p);
    return`<div class="sched-legend-item"><div class="sched-legend-dot" style="background:${c.bg}"></div>${cu?(cu.name||'未填姓名'):p}</div>`;
  }).join('');

  // always render grid so drag works even with no entries
  let gridHtml=`<div class="sched-grid" style="margin-top:8px;position:relative">`;
  for(let h=HOUR_START;h<HOUR_END;h++){
    gridHtml+=`<div class="sched-hour-label" style="height:48px;display:flex;align-items:flex-start;padding-top:4px">${h}</div><div class="sched-slot"></div>`;
  }
  gridHtml+=`<div id="day-overlay" style="position:absolute;top:0;left:36px;right:0;height:${totalPx}px;pointer-events:none"></div></div>`;
  document.getElementById('day-timeline').innerHTML = entries.length ? gridHtml : '<div class="empty" style="padding-top:32px">今日無排程</div>';
  if(!entries.length)return;

  const overlay=document.getElementById('day-overlay');

  // now line
  if(schedViewDate===todayStr()){
    const nowM=toMinutes(new Date().toTimeString().slice(0,5));
    if(nowM>=startMins&&nowM<HOUR_END*60){
      const nowLine=document.createElement('div');
      nowLine.className='sched-now-line';
      nowLine.style.top=Math.round((nowM-startMins)*PX)+'px';
      overlay.appendChild(nowLine);
    }
  }

  // build blocks
  rebuildBlocks(entries, overlay, colorMap, startMins, HOUR_END, PX, SNAP);

  // overflow bars
  rebuildOverflow(entries, overlay, startMins, HOUR_END, PX);
}

function rebuildBlocks(entries, overlay, colorMap, startMins, HOUR_END, PX, SNAP){
  overlay.querySelectorAll('.sched-block').forEach(b=>b.remove());
  const SNAP_M = SNAP || 15;

  entries.forEach(e=>{
    const es=toMinutes(e.start);
    const concurrent=entries.filter(o=>o.id!==e.id&&toMinutes(o.start)<es+e.dur&&toMinutes(o.start)+o.dur>es);
    const slotIdx=concurrent.filter(o=>toMinutes(o.start)<es||(toMinutes(o.start)===es&&o.id<e.id)).length%2;
    const cols=Math.min(concurrent.length+1,2),wPct=100/cols,lPct=slotIdx*wPct;
    const topPx=(es-startMins)*PX;
    const hPx=Math.max(e.dur*PX,28);
    const col=colorMap[e.phone];
    const cu=findCustomer(e.phone);
    const name=cu?(cu.name||'未填姓名'):'';

    const bl=document.createElement('div');
    bl.className='sched-block';
    bl.dataset.id=e.id;
    bl.style.cssText=`top:${Math.round(topPx)}px;height:${Math.round(hPx)}px;left:calc(${lPct}% + 2px);width:calc(${wPct}% - 4px);background:${col.bg};color:${col.text};pointer-events:auto;cursor:grab;touch-action:none;user-select:none`;
    bl.innerHTML=`<div class="sb-plate">${e.plate}</div><div class="sb-svc">${e.service} ${e.dur}min</div>${name?`<div style="font-size:10px;opacity:0.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${name}</div>`:''}<div style="position:absolute;bottom:0;left:0;right:0;height:12px;display:flex;align-items:center;justify-content:center;cursor:ns-resize" data-resize="1"><div style="width:22px;height:2px;border-radius:1px;background:currentColor;opacity:0.4"></div></div>`;

    let dragMode=null;
    let startY=0, origTop=0, origH=0;

    function snapPx(px){ return Math.round(px / (SNAP_M*PX)) * SNAP_M * PX; }

    bl.addEventListener('pointerdown', ev=>{
      const isResize = ev.target.dataset.resize==='1' || ev.target.closest('[data-resize]');
      dragMode = isResize ? 'resize' : 'move';
      startY = ev.clientY;
      origTop = parseInt(bl.style.top)||0;
      origH   = parseInt(bl.style.height)||hPx;
      bl.setPointerCapture(ev.pointerId);
      bl.style.cursor = dragMode==='resize' ? 'ns-resize' : 'grabbing';
      bl.style.opacity='0.85';
      bl.style.zIndex='20';
      ev.preventDefault();
    });

    bl.addEventListener('pointermove', ev=>{
      if(!dragMode) return;
      const dy = ev.clientY - startY;
      if(dragMode==='move'){
        const maxTop = (HOUR_END - startMins/60)*60*PX - origH;
        const newTop = Math.max(0, Math.min(snapPx(origTop+dy), maxTop));
        bl.style.top = newTop+'px';
        const newMin = Math.round(newTop/PX) + startMins;
        bl.querySelector('.sb-svc').textContent = `${fromMinutes(newMin)} · ${e.dur}min`;
      } else {
        const newH = Math.max(SNAP_M*PX, snapPx(origH+dy));
        bl.style.height = newH+'px';
        const newDur = Math.round(newH/PX);
        bl.querySelector('.sb-svc').textContent = `${e.start} · ${newDur}min`;
      }
    });

    bl.addEventListener('pointerup', ev=>{
      const dy = ev.clientY - startY;
      bl.style.cursor='grab';
      bl.style.opacity='1';
      bl.style.zIndex='2';

      if(Math.abs(dy)<5 && dragMode==='move'){
        // tap → open detail sheet
        dragMode=null;
        openSchedDetail(e.id);
        return;
      }

      if(dragMode==='move'){
        const maxTop = (HOUR_END - startMins/60)*60*PX - origH;
        const newTop = Math.max(0, Math.min(snapPx(origTop+dy), maxTop));
        const newMin = Math.round(newTop/PX) + startMins;
        e.start = fromMinutes(Math.max(startMins, Math.min(HOUR_END*60-e.dur, newMin)));
      } else if(dragMode==='resize'){
        const newH = Math.max(SNAP_M*PX, snapPx(origH+dy));
        e.dur = Math.round(newH/PX);
      }
      dragMode=null;
      scheduleSave();
      // re-render blocks only, stay in day view
      const allEntries=(db.schedule||[]).filter(en=>en.date===schedViewDate);
      const cm={};allEntries.forEach(en=>cm[en.phone]=getColor(en.phone));
      const ov=document.getElementById('day-overlay');
      rebuildBlocks(allEntries, ov, cm, startMins, HOUR_END, PX, SNAP_M);
      rebuildOverflow(allEntries, ov, startMins, HOUR_END, PX);
    });

    bl.addEventListener('pointercancel', ()=>{
      dragMode=null;
      bl.style.cursor='grab';
      bl.style.opacity='1';
      bl.style.zIndex='2';
    });

    overlay.appendChild(bl);
  });
}

function rebuildOverflow(entries, overlay, startMins, HOUR_END, PX){
  overlay.querySelectorAll('.sched-overflow-bar').forEach(b=>b.remove());
  const overlapBuckets={};
  entries.forEach(e=>{const es=toMinutes(e.start);for(let m=es;m<es+e.dur;m++){if(!overlapBuckets[m])overlapBuckets[m]=[];overlapBuckets[m].push(e.id);}});
  const overflowRanges=[];let inO=false,oStart=null;
  for(let m=startMins;m<HOUR_END*60;m++){
    const cnt=(overlapBuckets[m]||[]).length;
    if(cnt>2){if(!inO){inO=true;oStart=m;}}
    else{if(inO){overflowRanges.push({start:oStart,end:m});inO=false;}}
  }
  if(inO)overflowRanges.push({start:oStart,end:HOUR_END*60});
  overflowRanges.forEach(r=>{
    const topPx=(r.start-startMins)*PX,hPx=(r.end-r.start)*PX;
    const bl=document.createElement('div');bl.className='sched-overflow-bar';
    bl.style.cssText=`top:${Math.round(topPx)}px;height:${Math.round(hPx)}px;left:2px;right:2px`;
    bl.innerHTML=`⚠ 超出2台 ${fromMinutes(r.start)}–${fromMinutes(r.end)} (${r.end-r.start}min)`;
    overlay.appendChild(bl);
  });
}

let schedDetailId = null;

function openSchedDetail(id){
  const e=(db.schedule||[]).find(e=>e.id===id);
  if(!e)return;
  schedDetailId=id;
  const cu=findCustomer(e.phone);
  const name=cu?(cu.name||'未填姓名'):e.phone;
  document.getElementById('sched-detail-title').textContent=`${e.plate} · ${name} · ${e.service}`;
  document.getElementById('sd-date').value=e.date;
  document.getElementById('sd-start').value=e.start;
  document.getElementById('sd-dur').value=e.dur;
  document.getElementById('sd-msg').innerHTML='';
  document.getElementById('sched-detail-overlay').style.display='block';
  document.getElementById('sched-detail-sheet').style.display='block';
}

function closeSchedDetail(){
  document.getElementById('sched-detail-overlay').style.display='none';
  document.getElementById('sched-detail-sheet').style.display='none';
  schedDetailId=null;
}

function saveSchedDetail(){
  const e=(db.schedule||[]).find(e=>e.id===schedDetailId);
  if(!e)return;
  const newDate=document.getElementById('sd-date').value;
  const newStart=document.getElementById('sd-start').value;
  const newDur=parseInt(document.getElementById('sd-dur').value)||e.dur;
  if(!newDate||!newStart){document.getElementById('sd-msg').innerHTML='<div class="msg msg-error">請填入日期和時間</div>';return;}
  e.date=newDate; e.start=newStart; e.dur=newDur;
  scheduleSave();
  closeSchedDetail();
  // if date changed, update view date
  if(newDate!==schedViewDate){
    schedViewDate=newDate;
    const[y,m]=newDate.split('-').map(Number);
    schedMonth={y,m};
  }
  renderDay();
  renderMonth();
}

function deleteSchedDetail(){
  if(!schedDetailId)return;
  const e=(db.schedule||[]).find(e=>e.id===schedDetailId);
  if(!e)return;
  if(confirm(`刪除排程？\n${e.plate} / ${e.service}\n${e.date} ${e.start}（${e.dur} 分）`)){
    db.schedule=db.schedule.filter(s=>s.id!==schedDetailId);
    scheduleSave();
    closeSchedDetail();
    renderDay();
    renderMonth();
  }
}

function schedFillCar(){const phone=document.getElementById('sched-phone').value.trim();const sel=document.getElementById('sched-plate');const c=findCustomer(phone);sel.innerHTML=c?c.cars.map(v=>`<option value="${v.plate}">${v.plate} ${v.type}</option>`).join(''):'<option value="">— 選車 —</option>';checkSchedOverlap();}
function checkSchedOverlap(){const start=document.getElementById('sched-start').value;const dur=parseInt(document.getElementById('sched-dur').value)||60;const warnEl=document.getElementById('sched-overlap-warn');if(!schedViewDate||!start){warnEl.innerHTML='';return;}const startM=toMinutes(start),endM=startM+dur;const entries=(db.schedule||[]).filter(e=>e.date===schedViewDate);const cnt=countOverlapAt(entries,startM,endM);if(cnt===0)warnEl.innerHTML=`<div class="msg msg-success">此時段空閒</div>`;else if(cnt===1)warnEl.innerHTML=`<div class="msg msg-info">此時段已有 1 台，再加 1 台達上限</div>`;else warnEl.innerHTML=`<div class="msg msg-error">此時段已有 ${cnt} 台，超過上限（最多 2 台）</div>`;}
function addSchedEntry(){const phone=document.getElementById('sched-phone').value.trim();const plate=document.getElementById('sched-plate').value;const service=document.getElementById('sched-service').value;const dur=parseInt(document.getElementById('sched-dur').value)||60;const start=document.getElementById('sched-start').value;const msgEl=document.getElementById('sched-add-msg');if(!phone||!findCustomer(phone)){msgEl.innerHTML='<div class="msg msg-error">找不到此客戶電話</div>';return;}if(!plate){msgEl.innerHTML='<div class="msg msg-error">請選擇車輛</div>';return;}if(!start){msgEl.innerHTML='<div class="msg msg-error">請填入時間</div>';return;}const startM=toMinutes(start),endM=startM+dur;const entries=(db.schedule||[]).filter(e=>e.date===schedViewDate);const cnt=countOverlapAt(entries,startM,endM);if(cnt>=2){msgEl.innerHTML=`<div class="msg msg-error">此時段已達 2 台上限，無法新增</div>`;return;}const id='S'+String((db.schedule||[]).length+1).padStart(3,'0');db.schedule.push({id,phone,plate,service,date:schedViewDate,start,dur});msgEl.innerHTML=`<div class="msg msg-success">${plate} / ${service} 已排入 ${schedViewDate} ${start}</div>`;renderDay();renderMonth();}
function confirmDeleteSched(id){const e=(db.schedule||[]).find(e=>e.id===id);if(!e)return;if(confirm(`刪除排程？\n${e.plate} / ${e.service}\n${e.date} ${e.start} (${e.dur}分)`)){db.schedule=db.schedule.filter(s=>s.id!==id);renderDay();renderMonth();}}

document.addEventListener('change',e=>{if(['sched-start','sched-dur'].includes(e.target.id))checkSchedOverlap();});

/* ═══════════════════════════════════════════
   localStorage 自動儲存
═══════════════════════════════════════════ */
const STORAGE_KEY = 'carwash_db_v1';
let saveTimer = null;

function saveDb() {
  try {
    const toSave = {
      customers: db.customers,
      orders: db.orders,
      wallets: db.wallets,
      referrals: db.referrals,
      schedule: db.schedule,
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
    showSaveIndicator();
  } catch(e) {
    console.warn('儲存失敗:', e);
  }
}

function loadDb() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const saved = JSON.parse(raw);
    if (saved.customers) db.customers = saved.customers;
    if (saved.orders) db.orders = saved.orders;
    if (saved.wallets) db.wallets = saved.wallets;
    if (saved.referrals) db.referrals = saved.referrals;
    if (saved.schedule) db.schedule = saved.schedule;
    return true;
  } catch(e) {
    console.warn('讀取失敗:', e);
    return false;
  }
}

function scheduleSave() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(saveDb, 800);
}

function showSaveIndicator() {
  const el = document.getElementById('save-indicator');
  if (!el) return;
  el.style.opacity = '1';
  setTimeout(() => { el.style.opacity = '0'; }, 1500);
}

// Patch all db-mutating functions to auto-save
const _origAddCustomer = addCustomer;
addCustomer = function() { _origAddCustomer(); scheduleSave(); };

const _origCreateOrder = createOrder;
createOrder = function() { _origCreateOrder(); scheduleSave(); };

const _origSetStatus = setStatus;
setStatus = function(id, status) { _origSetStatus(id, status); scheduleSave(); };

const _origTodaySetStatus = todaySetStatus;
todaySetStatus = function(id, status) { _origTodaySetStatus(id, status); scheduleSave(); };

const _origDoTopup = doTopup;
doTopup = function() { _origDoTopup(); scheduleSave(); };

const _origAssignStaff = assignStaff;
assignStaff = function(id, staff) { _origAssignStaff(id, staff); scheduleSave(); };

const _origAddSchedEntry = addSchedEntry;
addSchedEntry = function() { _origAddSchedEntry(); scheduleSave(); };

const _origConfirmDeleteSched = confirmDeleteSched;
confirmDeleteSched = function(id) { _origConfirmDeleteSched(id); scheduleSave(); };

const _origApplyReferral = applyReferral;
applyReferral = function(phone) { _origApplyReferral(phone); scheduleSave(); };

initServiceChips();

(function initApp(){
  const hasSaved = loadDb();
  const t = todayStr();
  if (!hasSaved) {
    // 首次使用：把範例訂單日期修正為今天
    ['O001','O002','O003'].forEach((id,i)=>{
      const o=db.orders.find(o=>o.id===id);
      if(o)o.created=`${t} ${['09:30','10:00','11:00'][i]}`;
    });
  }
  schedViewDate = t;
  const[y,m] = t.split('-').map(Number);
  schedMonth = {y, m};
})();

renderHistoryList();
renderToday();
